name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.in-project true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # Install LLVM for llvmlite and compilers for CVXPY solvers
          sudo apt-get install -y llvm-15-dev clang build-essential gfortran

      - name: Configure Environment
        # This ensures the Poetry Sync step knows exactly which LLVM to use for the build
        run: |
          echo "LLVM_CONFIG=/usr/bin/llvm-config-15" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-lint-ubuntu-3.13-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-lint-ubuntu-3.13-

      # --sync guarantees the installed state matches pyproject.toml exactly,
      # even when restoring a cached venv from a slightly different lock.
      - name: Install package + all dependencies
        # Use --no-interaction and --no-root to separate environment prep
        # In Poetry 2.0, 'poetry sync' replaces 'install --sync'
        run: |
          poetry sync --with dev --no-interaction

      - name: Verify systematic_macro importable
        run: poetry run python -c "import systematic_macro; print('OK', edgar_alpha.__version__)"

      - name: Lint with Ruff
        run: poetry run ruff check src/ tests/

      - name: Type check with mypy
        run: poetry run mypy src/systematic_macro --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          poetry run pytest tests/ -v --tb=short \
            --cov=systematic_macro \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
