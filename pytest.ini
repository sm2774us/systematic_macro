[pytest]
# Directory where tests are located
testpaths = tests

# Default command line arguments
# --cov: Specify the source directory to measure
# --cov-report: Output formats (term-missing shows which lines were skipped)
# --cov-fail-under: The build will exit with an error if coverage is < 75%
addopts = 
    --cov=systematic_macro 
    --cov-report=term-missing 
    --cov-report=html 
    --cov-fail-under=75

# Patterns for finding test files and classes
python_files = test_*.py
python_classes = Test*
python_functions = test_*
