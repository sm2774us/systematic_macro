[tool.poetry]
name = "systematic-macro"
version = "0.1.0"
description = "Systematic Macro Signal Research Pipeline: Carry, Momentum, Flow for FX/Futures/Equities 2026"
authors = ["Systematic Macro Research <research@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "systematic_macro", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
numpy = "^1.26"
pandas = "^2.2"
scipy = "^1.13"
statsmodels = "^0.14"
scikit-learn = "^1.5"
matplotlib = "^3.9"
seaborn = "^0.13"
yfinance = "^0.2"
requests = "^2.32"
pydantic = "^2.7"
loguru = "^0.7"
rich = "^13.7"
joblib = "^1.4"
cvxpy = "^1.5"
numba = "^0.60"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
pytest-mock = "^3.14"
pytest-asyncio = "^0.23"
black = "^24.4"
ruff = "^0.4"
mypy = "^1.10"
ipykernel = "^6.29"
nbformat = "^5.10"
nbconvert = "^7.16"
jupyter = "^1.0"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=systematic_macro --cov-report=term-missing --cov-report=html --cov-fail-under=100"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/systematic_macro"]
omit = ["*/conftest*"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
